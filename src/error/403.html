<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>403 Forbidden</title>
  <style>
    body, p, h1 {
      margin: unset;
      padding: unset;
    }

    body {
      color: #333;
      font-size: 1rem;
      font-weight: 700;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      line-height: 1.8;
      background-color: #fefefe;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;

      &::before {
        content: '';
        background-color: #333;
        width: 100%;
        height: 1px;
        position: absolute;
        top: 50%;
        left: 0;
        display: inline-block;
        z-index: -1;
      }
    }

    div {
      padding: 2em;
      text-align: center;
      background-color: #fefefe;
    }

    p {
      font-size: 2em;
    }

    h1 {
      font-size: 1.5em;
    }
  </style>
</head>
<body>

  <div>
    <p>403</p>
    <h1>FORBIDDEN</h1>
  </div>

</body>
</html>
